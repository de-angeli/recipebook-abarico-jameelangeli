{% extends 'base.html' %}

{% load static %}

{% block content %}
    <h2>Add Image to {{ recipe.name }}</h2>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Upload Image</button>
    </form>

    <a href="{% url 'ledger:recipe-detail' recipe.pk %}">Back to Recipe</a>
{% endblock %}
